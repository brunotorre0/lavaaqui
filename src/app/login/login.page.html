<ion-content [fullscreen]="true" class="login-content">
  <div class="login-banner">
    <img src="assets/images/LavaAquiLogo.png" alt="LavaAqui Logo" class="banner-logo">
    <h1 class="banner-title">LavaAqui</h1>
  </div>

  <div class="login-card">
    <div class="toggle-buttons">
      <button class="toggle-btn" [class.active]="activeTab === 'login'" (click)="setActiveTab('login')">Iniciar Sessão</button>
      <button class="toggle-btn" [class.active]="activeTab === 'signup'" (click)="setActiveTab('signup')">Registar</button>
    </div>

    <form class="login-form">
      <div class="input-wrapper">
        <input type="text" class="form-input" [(ngModel)]="name" name="name" placeholder="Nome de utilizador">
      </div>

      <div class="input-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" class="form-input" [(ngModel)]="password" name="password" placeholder="Palavra-passe">
        <button type="button" class="visibility-toggle" (click)="togglePasswordVisibility('login')" aria-label="Mostrar ou ocultar palavra-passe">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <div class="input-wrapper" *ngIf="activeTab === 'signup'">
        <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-input" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirmar palavra-passe">
        <button type="button" class="visibility-toggle" (click)="togglePasswordVisibility('confirm')" aria-label="Mostrar ou ocultar confirmação da palavra-passe">
          <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <ion-button expand="block" class="login-button" (click)="activeTab === 'login' ? onLogin() : onSignUp()">
        {{ activeTab === 'login' ? 'Iniciar Sessão' : 'Registar' }}
      </ion-button>
    </form>
  </div>
</ion-content>
